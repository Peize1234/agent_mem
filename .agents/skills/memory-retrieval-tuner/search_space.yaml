version: 1

skill:
  name: memory-retrieval-tuner

evaluation:
  # Primary Recall cutoff. User invocation may override this, e.g. k=10.
  k: 5
  min_k: 1
  primary_metric: requirement_recall_at_k
  secondary_cutoffs:
    - multiplier: 2
    - multiplier: 4
  report_metrics:
    - requirement_recall_at_k
    - macro_session_recall_at_k
    - mrr
    - mean_gold_rank
    - median_gold_rank
    - shortterm_coverage
    - target_layer_union
    - all_memory_union
    - query_completion
    - candidate_pool_recall
    - final_context_recall
    - context_precision
    - mean_returned_pages
    - midterm_contribution
    - session_longterm_contribution
    - short_mid_session_longterm_union
    - session_stability
    - runtime_seconds
    - llm_calls
    - embedding_calls
  gold_semantics:
    and_separator: "；"
    or_group_parentheses: true
    denominator: required_context_fixed
    semantic_judge: controlled
    deterministic_fact_checks: [number, percentage, date, amount, entity, unit]

target:
  default: midterm
  allowed:
    - midterm
    - all_memory

parameters:
  classes:
    query_time_retrieval_only:
      - top_k_pages
      - max_total_pages
      - midterm_candidate_pool_multiplier
      - midterm_rag_threshold
      - longterm_top_k
      - longterm_rag_threshold
      - longterm_candidate_pool_multiplier
      - longterm_hybrid_preset
      - entity_similarity_threshold
      - dense_weight
      - rerank_depth
      - candidate_depth
      - max_queries
      - max_total_results
      - query_rewrite_prompt
    source_changing:
      - short_term_capacity
      - session_similarity_threshold
      - embedding_similarity_weight
      - keyword_overlap_weight
      - top_k_sessions
      - page_summary_prompt
      - session_merge_prompt
      - fine_grained_longterm_extraction_prompt
      - session_longterm_extraction_prompt
      - embedding_model_id
      - embedding_model_revision
    within_session_stateful:
      - retention_half_life_turns
      - retention_floor
      - heat_alpha
      - heat_beta
      - heat_gamma
      - heat_recency_tau_turns
      - heat_modulation_min
      - heat_modulation_max
      - promotion_min_recall_count
      - promotion_heat_threshold
    cross_session_temporal_stateful:
      - cross_session_longterm_rag_threshold
      - cross_session_retention_half_life_hours
      - cross_session_retention_floor
      - cross_session_reinforcement_gain
    production_fixed_not_searched:
      - longterm_other_session_weight
  hard_constraints:
    top_k_pages: {min: 1}
    top_k_sessions: {min: 1}
    max_total_pages: {min: 1, max: 5}
    longterm_top_k: {min: 1, max: 30}
    midterm_candidate_pool_multiplier: {min: 1, max: 8}
    longterm_candidate_pool_multiplier: {min: 1, max: 6}
    short_term_capacity: {positive_even: true}
    session_similarity_threshold: {min: 0, max: 1}
    embedding_similarity_weight: {min: 0, paired_sum_with: keyword_overlap_weight, sum: 1}
    keyword_overlap_weight: {min: 0, paired_sum_with: embedding_similarity_weight, sum: 1}
    midterm_rag_threshold: {min: 0, max: 1}
    retention_half_life_turns: {exclusive_min: 0}
    retention_floor: {min: 0, max: 1}
    heat_alpha: {min: 0}
    heat_beta: {min: 0}
    heat_gamma: {min: 0}
    heat_recency_tau_turns: {exclusive_min: 0}
    heat_modulation_min: {exclusive_min: 0, exclusive_max: 1, less_than: heat_modulation_max}
    heat_modulation_max: {exclusive_min: 1, greater_than: heat_modulation_min}
    promotion_min_recall_count: {min: 1}
    promotion_heat_threshold: {min: 0}
    longterm_rag_threshold: {min: 0, max: 1}
    longterm_hybrid_preset:
      allowed: [semantic-heavy, balanced, keyword-heavy, entity-aware]
    entity_similarity_threshold: {min: 0, max: 1}
    dense_weight: {min: 0, max: 1}
    candidate_depth: {min: 1, max: 100}
    rerank_depth: {min: 1, max: 100}
    max_queries: {min: 1, max: 3}
    max_total_results: {min: 1, max: 5}
    agentic_fixed: {max_iterations: 2, max_tool_calls: 1}
    cross_session_longterm_rag_threshold: {min: 0, max: 1}
    cross_session_retention_half_life_hours: {exclusive_min: 0}
    cross_session_retention_floor: {min: 0, max: 1}
    cross_session_reinforcement_gain: {min: 0}

dataset:
  shortterm_qa_turns: 3
  fail_on:
    future_dependency: true
    cross_session_dependency: false
    duplicate_query_id: true
    missing_gold_target: true
    incomplete_source_run: true
  quality_warnings:
    explicit_history_target_leakage_ratio: 0.20
    single_distance_concentration_ratio: 0.60
    repeated_question_template_ratio: 0.30

split:
  unit: session
  seed: 42
  policies:
    many_sessions:
      min_sessions: 8
      method: deterministic_stratified_holdout
      tune_fraction: 0.70
      validation_fraction: 0.30
    medium_sessions:
      min_sessions: 5
      max_sessions: 7
      method: deterministic_holdout
      min_validation_sessions: 2
    few_sessions:
      min_sessions: 3
      max_sessions: 4
      method: leave_one_session_out
    tiny:
      max_sessions: 2
      method: exploratory_only

budget:
  default: standard
  profiles:
    quick:
      max_stages: 3
      max_cost_level: medium
      max_branches_per_stage: 1
      max_candidates_per_stage: 8
      screening_sessions: 1
      tune_frontier: 3
      max_expensive_candidates: 0
      validation_frontier: 2
    standard:
      max_stages: 8
      max_cost_level: high
      max_branches_per_stage: 2
      max_candidates_per_stage: 12
      screening_sessions: 2
      tune_frontier: 5
      max_expensive_candidates: 6
      validation_frontier: 5
    deep:
      max_stages: 12
      max_cost_level: expensive
      max_branches_per_stage: 3
      max_candidates_per_stage: 16
      screening_sessions: 2
      tune_frontier: 8
      max_expensive_candidates: 16
      validation_frontier: 8

selection:
  # Differences within this range are treated as practically tied.
  tie_tolerance_pp: 0.25
  min_improvement_pp: 0.25
  patience_stages: 2
  primary: validation_requirement_recall_at_k
  tie_breakers:
    - validation_macro_session_recall_at_k
    - session_stability
    - context_precision
    - lower_mean_returned_pages
    - mrr
    - recall_at_2k
    - recall_at_4k
    - lower_llm_calls
    - lower_embedding_cost
    - lower_runtime
    - lower_complexity
  overfit:
    mark_if_tune_improves_and_validation_delta_pp_below: -0.50

search:
  algorithm: staged_successive_filtering
  cartesian_grid: false
  reuse_frozen_artifacts: true
  require_provenance_validation: true

  # Stage 1 is always deterministic RetrievalControl. From Stage 2 onward the
  # Research LLM may select only Python-generated legal action IDs. Set false
  # for the unchanged fully deterministic policy.
  research:
    enabled: true
    max_attempts: 3

  branch_registry:
    RetrievalControl:
      enabled: true
      max_rounds: 2
    QueryRepresentation:
      # Legacy compatibility alias; QueryRewritePrompt is canonical in the
      # default branch_coverage and owns all normal Query Prompt candidates.
      enabled: true
      max_rounds: 3
    HybridRetrieval:
      enabled: true
      max_rounds: 2
    Reranking:
      enabled: true
      max_rounds: 1
    Embedding:
      enabled: true
      max_rounds: 1
    FieldAwareMultiVector:
      enabled: true
      max_rounds: 1
    PageRepresentation:
      enabled: true
      max_rounds: 1
    MidtermEvolution:
      enabled: true
      max_rounds: 2
    Promotion:
      # Future infrastructure only. The current benchmark has no
      # Cross-session Gold, so Promotion is never selected by staged tuning.
      enabled: false
      max_rounds: 1
    MidtermSourceConfig:
      enabled: true
      max_rounds: 1
    FineGrainedLongtermRetrieval:
      enabled: true
      max_rounds: 2
    QueryRewritePrompt:
      enabled: true
      max_rounds: 3
    MidtermPageSummaryPrompt:
      enabled: true
      max_rounds: 1
    MidtermSessionMergePrompt:
      enabled: true
      max_rounds: 1
    FineGrainedLongtermExtractionPrompt:
      enabled: true
      max_rounds: 1

  # Coverage tracks all relevant work. Every applicable core direction gets
  # one screening attempt when budget/resources permit. Research allocates
  # additional depth; it cannot permanently skip an affordable core screen.
  branch_coverage:
    candidate_coverage_bottleneck:
      relevant:
        RetrievalControl: {priority: 10, minimum_attempts: 1, coverage_class: required}
        HybridRetrieval: {priority: 20, minimum_attempts: 1, coverage_class: required}
        Embedding: {priority: 30, minimum_attempts: 1, coverage_class: required}
        QueryRewritePrompt: {priority: 40, minimum_attempts: 1, coverage_class: required}
        PageRepresentation: {priority: 50, minimum_attempts: 1, coverage_class: selectable}
        FieldAwareMultiVector: {priority: 60, minimum_attempts: 1, coverage_class: selectable}
        MidtermSourceConfig: {priority: 65, minimum_attempts: 1, coverage_class: expensive_gated}
        MidtermPageSummaryPrompt: {priority: 70, minimum_attempts: 1, coverage_class: expensive_gated}
        MidtermSessionMergePrompt: {priority: 71, minimum_attempts: 1, coverage_class: expensive_gated}
        FineGrainedLongtermExtractionPrompt: {priority: 72, minimum_attempts: 1, coverage_class: expensive_gated}
        FineGrainedLongtermRetrieval: {priority: 80, minimum_attempts: 1, coverage_class: selectable}
    ranking_bottleneck:
      relevant:
        RetrievalControl: {priority: 10, minimum_attempts: 1, coverage_class: required}
        HybridRetrieval: {priority: 20, minimum_attempts: 1, coverage_class: required}
        Reranking: {priority: 30, minimum_attempts: 1, coverage_class: required}
        FieldAwareMultiVector: {priority: 40, minimum_attempts: 1, coverage_class: selectable}
        QueryRewritePrompt: {priority: 50, minimum_attempts: 1, coverage_class: required}
        MidtermEvolution: {priority: 55, minimum_attempts: 1, coverage_class: selectable}
        FineGrainedLongtermRetrieval: {priority: 60, minimum_attempts: 1, coverage_class: selectable}
    session_instability:
      relevant:
        RetrievalControl: {priority: 10, minimum_attempts: 1, coverage_class: required}
        MidtermEvolution: {priority: 20, minimum_attempts: 1, coverage_class: required}
        PageRepresentation: {priority: 25, minimum_attempts: 1, coverage_class: selectable}
        MidtermSourceConfig: {priority: 28, minimum_attempts: 1, coverage_class: expensive_gated}
        MidtermPageSummaryPrompt: {priority: 30, minimum_attempts: 1, coverage_class: expensive_gated}
        MidtermSessionMergePrompt: {priority: 31, minimum_attempts: 1, coverage_class: expensive_gated}
        FineGrainedLongtermRetrieval: {priority: 40, minimum_attempts: 1, coverage_class: selectable}
    balanced_or_plateau:
      relevant:
        RetrievalControl: {priority: 10, minimum_attempts: 1, coverage_class: required}
        HybridRetrieval: {priority: 20, minimum_attempts: 1, coverage_class: required}
        QueryRewritePrompt: {priority: 30, minimum_attempts: 1, coverage_class: required}
        MidtermEvolution: {priority: 35, minimum_attempts: 1, coverage_class: required}
        PageRepresentation: {priority: 40, minimum_attempts: 1, coverage_class: selectable}
        MidtermSourceConfig: {priority: 45, minimum_attempts: 1, coverage_class: expensive_gated}
        FineGrainedLongtermRetrieval: {priority: 50, minimum_attempts: 1, coverage_class: selectable}

  stages:
    cheap:
      retrieval:
        enabled: true

        # Values are searched around the production baseline.
        # Implementation should clip lower bounds so every evaluated
        # candidate pool can return at least evaluation.k items.
        top_k_pages:
          mode: around_baseline
          relative_values:
            - -5
            - 0
            - 5
            - 15
          min_value_expression: "evaluation.k"
          refine_step: 2

        top_k_sessions:
          mode: around_baseline
          relative_values:
            - -1
            - 0
            - 1
            - 2
          min_value: 1
          refine_step: 1

        max_total_pages:
          mode: bounded_values
          values: [1, 2, 3, 4, 5]
          min_value: 1
          max_value: 5
          refine_step: 1

        midterm_rag_threshold:
          mode: coarse_to_fine
          coarse: [0.00, 0.05, 0.10, 0.15, 0.20, 0.30]
          min_value: 0.0
          max_value: 1.0

        midterm_candidate_pool_multiplier:
          values: [2, 4, 6, 8]
          min_value: 1
          max_value: 8

        agentic_retrieval:
          max_queries: [1, 2, 3]
          max_total_results: [1, 2, 3, 4, 5]
          fixed: {max_iterations: 2, max_tool_calls: 1}
          activation: final_fallback_only
          required_artifact: production_agentic_trace

        page_similarity_threshold:
          enabled: false
          reason: not part of the production MidTerm retrieval contract

        embedding_similarity_weight:
          enabled: false
          reason: affects production Session assignment, not query-time score fusion

        keyword_overlap_weight:
          enabled: false
          reason: affects production Session assignment and requires regenerated Sessions

        short_term_capacity:
          values: [4, 6, 8]
          positive_even: true
        session_similarity_threshold:
          values: [0.5, 0.6, 0.7, 0.8, 0.9]
        session_assignment_weight_presets:
          values: [[0.5, 0.5], [0.6, 0.4], [0.7, 0.3], [0.8, 0.2], [0.9, 0.1]]

        midterm_evolution:
          retention_half_life_turns: dynamic_from_dependency_distance
          heat_recency_tau_turns: dynamic_from_dependency_distance
          retention_floor: [0.05, 0.10, 0.20, 0.30, 0.40]
          heat_presets:
            recall-heavy: [1.0, 0.25, 0.5]
            balanced: [1.0, 0.5, 1.0]
            interaction-heavy: [0.75, 1.0, 0.5]
            recency-heavy: [0.75, 0.25, 1.5]
          heat_modulation_pairs: [[0.80, 1.20], [0.90, 1.10], [0.95, 1.05]]
          # Cross-session Gold is unavailable; retain production defaults and
          # do not materialize Promotion candidates in the current tuner.
          promotion_min_recall_count: production_default_only
          promotion_heat_threshold: production_default_only

    secondary:
      query_representation:
        max_rounds: 3
        variants_per_round: 3

      page_representation:
        values:
          - summary
          - summary_keywords
          - user_summary

      embedding_models:
        discovery:
          general_semantic_limit: 2
          finance_domain_limit: 2
        max_models_standard: 2
        max_models_deep: 4

      lexical_hybrid:
        methods:
          - dense_bm25_fusion
        dense_weight:
          mode: coarse_to_fine
          coarse:
            - 0.5
            - 0.7
            - 0.85
            - 1.0
          refine_step: 0.05

      reranking:
        min_deep_recall_gap_pp: 15.0
        methods:
          - field_lexical
          - auto_discovered_cross_encoder
        max_methods_standard: 2
        max_models_standard: 2
        max_models_deep: 3
        candidate_depth: {min: 1, max: 100}

      fine_grained_longterm:
        longterm_top_k: [5, 10, 15, 20, 25, 30]
        longterm_rag_threshold: [0.05, 0.10, 0.15, 0.20, 0.30, 0.40, 0.50]
        longterm_candidate_pool_multiplier: [2, 4, 6]
        hybrid_presets: [semantic-heavy, balanced, keyword-heavy, entity-aware]
        entity_similarity_threshold: [0.4, 0.5, 0.6, 0.7, 0.8]

      cross_session_temporal:
        tuning: disabled
        status: CROSS_SESSION_TUNING_UNSUPPORTED_NO_GOLD
        structural_replay: STRUCTURAL_ONLY_NOT_EVALUATED
        winner_selection: disabled
        no_gold_status: CROSS_SESSION_TUNING_UNSUPPORTED_NO_GOLD
        cross_session_longterm_rag_threshold: production_default_only
        cross_session_retention_half_life_hours: production_default_only
        cross_session_retention_floor: production_default_only
        cross_session_reinforcement_gain: production_default_only
        longterm_other_session_weight: production_default_only_no_cross_session_gold

      advanced_representation:
        methods:
          - field_aware_lexical
          - multi_vector_maxsim
        max_methods_standard: 1

    expensive:
      require_frontier_candidate: true
      max_prompt_candidates: 4

      memory_write_prompt:
        variants:
          - production_add
          - conservative_add
          - context_aware_add

      page_summary_prompt:
        variants:
          - production_summary
          - evidence_focused_summary
          - diagnostic_controlled_summary

diagnostics:
  ranking_bottleneck:
    # If deeper recall exceeds R@K by this many percentage points,
    # prioritize ranking/reranking over Page regeneration.
    min_recall_4k_minus_k_pp: 20.0

  candidate_coverage_bottleneck:
    # Heuristic. Implementation should compare against baseline and dataset difficulty,
    # not treat this as a universal scientific threshold.
    max_recall_4k_percent: 65.0

  session_instability:
    max_stddev_pp: 12.0
    max_worst_session_gap_from_macro_pp: 20.0

execution:
  max_parallel_sessions: 4
  max_parallel_candidates: 4
  max_parallel_llm_calls: 4
  cache_rankings_depth:
    # Store rankings deeper than K so changing K can often reuse ranking artifacts.
    multiplier_of_k: 4
    minimum: 20

repository:
  prefer_reuse:
    - exp/benchmark/benchmark_common.py
    - exp/benchmark/benchmark_memory.py
    - exp/benchmark/run_recall_benchmark.py
    - exp/benchmark/run_recall_isolated_sessions.py
    - exp/benchmark/midterm_retrieval_eval.py
    - exp/benchmark/diagnose_midterm_page_recall.py
    - exp/benchmark/diagnose_page_representation.py
    - exp/results
  if_missing: search_for_current_equivalent

output:
  root: exp/results/auto_tuning
  files:
    - dataset_audit.json
    - dataset_audit.md
    - split_manifest.json
    - search_trace.jsonl
    - branch_trace.jsonl
    - research_trace.jsonl
    - model_discovery.json
    - leaderboard.csv
    - best_config.json
    - best_config_diff.json
    - requirement_results.jsonl
    - session_metrics.csv
    - final_report.md
    - run_metadata.json
