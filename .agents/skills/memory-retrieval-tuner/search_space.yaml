version: 1

skill:
  name: memory-retrieval-tuner

evaluation:
  # Primary Recall cutoff. User invocation may override this, e.g. k=10.
  k: 5
  min_k: 1
  primary_metric: requirement_recall_at_k
  secondary_cutoffs:
    - multiplier: 2
    - multiplier: 4
  report_metrics:
    - requirement_recall_at_k
    - macro_session_recall_at_k
    - mrr
    - mean_gold_rank
    - median_gold_rank
    - shortterm_coverage
    - target_layer_union
    - all_memory_union
    - query_completion
  gold_semantics:
    and_separator: "；"
    or_group_parentheses: true

target:
  default: midterm
  allowed:
    - midterm

dataset:
  shortterm_qa_turns: 3
  fail_on:
    future_dependency: true
    cross_session_dependency: true
    duplicate_query_id: true
    missing_gold_target: true
    incomplete_source_run: true
  quality_warnings:
    explicit_history_target_leakage_ratio: 0.20
    single_distance_concentration_ratio: 0.60
    repeated_question_template_ratio: 0.30

split:
  unit: session
  seed: 42
  policies:
    many_sessions:
      min_sessions: 8
      method: deterministic_stratified_holdout
      tune_fraction: 0.70
      validation_fraction: 0.30
    medium_sessions:
      min_sessions: 5
      max_sessions: 7
      method: deterministic_holdout
      min_validation_sessions: 2
    few_sessions:
      min_sessions: 3
      max_sessions: 4
      method: leave_one_session_out
    tiny:
      max_sessions: 2
      method: exploratory_only

budget:
  default: standard
  profiles:
    quick:
      max_stages: 3
      max_cost_level: medium
      max_branches_per_stage: 1
      max_candidates_per_stage: 8
      screening_sessions: 1
      tune_frontier: 3
      max_expensive_candidates: 0
      validation_frontier: 2
    standard:
      max_stages: 8
      max_cost_level: high
      max_branches_per_stage: 2
      max_candidates_per_stage: 12
      screening_sessions: 2
      tune_frontier: 5
      max_expensive_candidates: 6
      validation_frontier: 5
    deep:
      max_stages: 12
      max_cost_level: expensive
      max_branches_per_stage: 3
      max_candidates_per_stage: 16
      screening_sessions: 2
      tune_frontier: 8
      max_expensive_candidates: 16
      validation_frontier: 8

selection:
  # Differences within this range are treated as practically tied.
  tie_tolerance_pp: 0.25
  min_improvement_pp: 0.25
  patience_stages: 2
  primary: validation_requirement_recall_at_k
  tie_breakers:
    - validation_macro_session_recall_at_k
    - session_stability
    - mrr
    - recall_at_2k
    - recall_at_4k
    - lower_llm_calls
    - lower_embedding_cost
    - lower_runtime
    - lower_complexity
  overfit:
    mark_if_tune_improves_and_validation_delta_pp_below: -0.50

search:
  algorithm: staged_successive_filtering
  cartesian_grid: false
  reuse_frozen_artifacts: true
  require_provenance_validation: true

  # Stage 1 is always deterministic RetrievalControl. From Stage 2 onward the
  # Research LLM may select only Python-generated legal action IDs. Set false
  # for the unchanged fully deterministic policy.
  research:
    enabled: true
    max_attempts: 3

  branch_registry:
    RetrievalControl:
      enabled: true
      max_rounds: 2
    QueryRepresentation:
      enabled: true
      max_rounds: 3
    HybridRetrieval:
      enabled: true
      max_rounds: 2
    Reranking:
      enabled: true
      max_rounds: 1
    Embedding:
      enabled: true
      max_rounds: 1
    FieldAwareMultiVector:
      enabled: true
      max_rounds: 1
    PageRepresentation:
      enabled: true
      max_rounds: 1
    MemoryWriteAddPrompt:
      enabled: true
      max_rounds: 1

  # Coverage tracks all relevant work. In Research mode only `required` is a
  # hard minimum; selectable work may be temporarily deprioritized. An
  # expensive_gated action is legal once Python hard constraints allow it,
  # even if cheaper selectable Branches remain.
  branch_coverage:
    candidate_coverage_bottleneck:
      relevant:
        RetrievalControl: {priority: 10, minimum_attempts: 1, coverage_class: required}
        HybridRetrieval: {priority: 20, minimum_attempts: 0, coverage_class: selectable}
        Embedding: {priority: 30, minimum_attempts: 0, coverage_class: selectable}
        QueryRepresentation: {priority: 40, minimum_attempts: 0, coverage_class: selectable}
        PageRepresentation: {priority: 50, minimum_attempts: 0, coverage_class: selectable}
        FieldAwareMultiVector: {priority: 60, minimum_attempts: 0, coverage_class: selectable}
        MemoryWriteAddPrompt: {priority: 70, minimum_attempts: 0, coverage_class: expensive_gated}
    ranking_bottleneck:
      relevant:
        RetrievalControl: {priority: 10, minimum_attempts: 1, coverage_class: required}
        HybridRetrieval: {priority: 20, minimum_attempts: 0, coverage_class: selectable}
        Reranking: {priority: 30, minimum_attempts: 0, coverage_class: selectable}
        FieldAwareMultiVector: {priority: 40, minimum_attempts: 0, coverage_class: selectable}
        QueryRepresentation: {priority: 50, minimum_attempts: 0, coverage_class: selectable}
    session_instability:
      relevant:
        RetrievalControl: {priority: 10, minimum_attempts: 1, coverage_class: required}
        PageRepresentation: {priority: 20, minimum_attempts: 0, coverage_class: selectable}
        MemoryWriteAddPrompt: {priority: 30, minimum_attempts: 0, coverage_class: expensive_gated}
    balanced_or_plateau:
      relevant:
        RetrievalControl: {priority: 10, minimum_attempts: 1, coverage_class: required}
        HybridRetrieval: {priority: 20, minimum_attempts: 0, coverage_class: selectable}
        QueryRepresentation: {priority: 30, minimum_attempts: 0, coverage_class: selectable}
        PageRepresentation: {priority: 40, minimum_attempts: 0, coverage_class: selectable}

  stages:
    cheap:
      retrieval:
        enabled: true

        # Values are searched around the production baseline.
        # Implementation should clip lower bounds so every evaluated
        # candidate pool can return at least evaluation.k items.
        top_k_pages:
          mode: around_baseline
          relative_values:
            - -5
            - 0
            - 5
            - 15
          min_value_expression: "evaluation.k"
          refine_step: 2

        top_k_sessions:
          mode: around_baseline
          relative_values:
            - -1
            - 0
            - 1
            - 2
          min_value: 1
          refine_step: 1

        max_total_pages:
          mode: around_baseline
          relative_values:
            - -10
            - 0
            - 10
            - 30
          min_value_expression: "evaluation.k"
          refine_step: 5

        session_similarity_threshold:
          enabled: false
          reason: affects production Session generation and requires a regenerated source artifact

        page_similarity_threshold:
          enabled: false
          reason: not part of the production MidTerm retrieval contract

        embedding_similarity_weight:
          enabled: false
          reason: affects production Session assignment, not query-time score fusion

        keyword_overlap_weight:
          enabled: false
          reason: affects production Session assignment and requires regenerated Sessions

    secondary:
      query_representation:
        max_rounds: 3
        variants_per_round: 3

      page_representation:
        values:
          - summary
          - summary_keywords
          - user_summary

      embedding_models:
        discovery:
          general_semantic_limit: 2
          finance_domain_limit: 2
        max_models_standard: 2
        max_models_deep: 4

      lexical_hybrid:
        methods:
          - dense_bm25_fusion
        dense_weight:
          mode: coarse_to_fine
          coarse:
            - 0.5
            - 0.7
            - 0.85
            - 1.0
          refine_step: 0.05

      reranking:
        min_deep_recall_gap_pp: 15.0
        methods:
          - field_lexical
          - auto_discovered_cross_encoder
        max_methods_standard: 2
        max_models_standard: 2
        max_models_deep: 3

      advanced_representation:
        methods:
          - field_aware_lexical
          - multi_vector_maxsim
        max_methods_standard: 1

    expensive:
      require_frontier_candidate: true
      max_prompt_candidates: 4

      memory_write_prompt:
        variants:
          - production_add
          - conservative_add
          - context_aware_add

      page_summary_prompt:
        variants:
          - production_summary
          - evidence_focused_summary
          - diagnostic_controlled_summary

diagnostics:
  ranking_bottleneck:
    # If deeper recall exceeds R@K by this many percentage points,
    # prioritize ranking/reranking over Page regeneration.
    min_recall_4k_minus_k_pp: 20.0

  candidate_coverage_bottleneck:
    # Heuristic. Implementation should compare against baseline and dataset difficulty,
    # not treat this as a universal scientific threshold.
    max_recall_4k_percent: 65.0

  session_instability:
    max_stddev_pp: 12.0
    max_worst_session_gap_from_macro_pp: 20.0

execution:
  max_parallel_sessions: 4
  max_parallel_candidates: 4
  max_parallel_llm_calls: 4
  cache_rankings_depth:
    # Store rankings deeper than K so changing K can often reuse ranking artifacts.
    multiplier_of_k: 4
    minimum: 20

repository:
  prefer_reuse:
    - exp/benchmark/benchmark_common.py
    - exp/benchmark/benchmark_memory.py
    - exp/benchmark/run_recall_benchmark.py
    - exp/benchmark/run_recall_isolated_sessions.py
    - exp/benchmark/midterm_retrieval_eval.py
    - exp/benchmark/diagnose_midterm_page_recall.py
    - exp/benchmark/diagnose_page_representation.py
    - exp/results
  if_missing: search_for_current_equivalent

output:
  root: exp/results/auto_tuning
  files:
    - dataset_audit.json
    - dataset_audit.md
    - split_manifest.json
    - search_trace.jsonl
    - branch_trace.jsonl
    - research_trace.jsonl
    - model_discovery.json
    - leaderboard.csv
    - best_config.json
    - best_config_diff.json
    - requirement_results.jsonl
    - session_metrics.csv
    - final_report.md
    - run_metadata.json
