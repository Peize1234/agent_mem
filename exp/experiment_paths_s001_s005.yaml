meta:
  title: Agent Memory MidTerm Experiment Paths — S001-S005
  repository: Peize1234/agent_mem
  branch: refactor/demo-isolation
  primary_experiment_root: exp
  scope_sessions:
  - S001
  - S002
  - S003
  - S004
  - S005
  short_term_window_qa: 3
  purpose: 用于自动绘制实验演进路径；尽量展开 exp 下前 5 个 Session 相关的小实验。
  status_semantics:
    baseline: 基线/对照
    completed: 实际有结果产物的实验
    improved: 相对直接父节点有正向结果
    best: 该阶段被选中的最佳/主线方案
    degraded: 实际完成但核心指标下降
    tied: 核心指标持平
    blocked: 实验尝试存在，但因资源/凭据/模型产物等未完成
    diagnostic: 诊断/审计，不直接作为候选方案
    oracle: 仅用于上界，不可部署
  metric_note: 不同阶段 denominator 不完全相同：S001 初始实验为 21 eligible Gold；S001-S005 主开发实验为 154 eligible Gold。不要跨 denominator 直接比较
    Gold 数。
  node_count: 307
  edge_count: 316
  experiment_node_count: 272
  hub_node_count: 32
  diagnostic_node_count: 3
